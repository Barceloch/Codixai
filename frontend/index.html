<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Codixai</title>
    <script>
      // Apply the persisted theme before the first paint, so the window does
      // not flash the wrong theme while the Svelte application starts.
      ;(function () {
        try {
          var preference = localStorage.getItem('codixai.theme') || 'system'
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var locale = localStorage.getItem('codixai.locale')
          if (locale === 'en' || locale === 'es') {
            document.documentElement.lang = locale
          }
        } catch (error) {
          // Storage can be unavailable; the defaults of the document stay.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

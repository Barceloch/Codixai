<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codixai</title>
  <!--
    The Wails v2 runtime of a static frontend. The generated wailsjs folder
    of a Node frontend only wraps these two scripts: window.go holds the
    bound Go methods and window.runtime holds the runtime API.
  -->
  <script src="/wails/ipc.js"></script>
  <script src="/wails/runtime.js"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="bar">
    <h1>Codixai</h1>
    <p class="subtitle">Audit the changes of a repository. The tool only reads it.</p>
  </header>

  <main>
    <form id="audit-form" class="panel" autocomplete="off">
      <div class="field">
        <label for="root">Repository root</label>
        <input id="root" name="root" type="text" spellcheck="false" placeholder="/path/to/repository" />
      </div>

      <fieldset class="field">
        <legend>Origin</legend>
        <label class="choice">
          <input type="radio" name="origin" value="worktree" checked />
          <span>Worktree (uncommitted changes)</span>
        </label>
        <label class="choice">
          <input type="radio" name="origin" value="base" />
          <span>Base revision</span>
        </label>
        <label for="base" class="base-label">Base ref</label>
        <input id="base" name="base" type="text" spellcheck="false" placeholder="main" disabled />
      </fieldset>

      <button id="run" type="submit">Run audit</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>

    <section id="result" class="panel hidden" aria-labelledby="summary-title">
      <h2 id="summary-title">Summary</h2>
      <dl id="summary" class="summary"></dl>
      <p id="threshold" class="threshold"></p>
      <h2>Findings</h2>
      <p id="empty" class="empty hidden">No findings.</p>
      <ul id="findings" class="findings"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
